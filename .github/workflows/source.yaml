name: "Source workflow"

on:
  workflow_dispatch:
    inputs:
      src_dispatch:
        description: 'Source of the dispatch event (manual, argocd-values, installer)'
        type: string
        required: false

jobs:
  source-workflow:
    runs-on: [ ubuntu-22.04 ]
    # secrets: inherit
    steps:
      #- name: Dispatch and get URL
      #  id: dispatch
      #  uses: benc-uk/workflow-dispatch@v1
      #  with:
      #    workflow: 'target.yaml'
      #    ref: 'main'
      #    inputs: '{ "target_input": "12345" }'

      - name: 'Dispatch Workflow with Discovery'
        uses: lasith-kg/dispatch-workflow@v1
        id: dispatch-with-discovery
        with:
          dispatch-method: workflow_dispatch
          owner: baohuynh09-lxp
          repo: quickstart
          ref: main
          workflow: target.yaml # Or Workflow ID
          token: ${{ secrets.TOKEN }} # GitHub Token With Relevant Permissions
          discover: true
          workflow-inputs: |
            {
              "target_input": "baohuynh"
            }

      - id: echo-run-id-url
        name: "Echo Run ID and Run URL"
        run: |
          echo "${{ steps.dispatch-with-discovery.outputs.run-id }}"
          echo "${{ steps.dispatch-with-discovery.outputs.run-url }}"
          echo "Writing to file"
          echo "${{ steps.dispatch-with-discovery.outputs.run-url }}" > audit.txt

      - uses: bacongobbler/azure-blob-storage-upload@main
        with:
          source_dir: .
          account_name: deploycentralsitewf
          container_name: dev-az
          connection_string: ${{ secrets.deploycentralsitestkey }}
          extra_args: '--pattern *.txt'
          # WARNING: this will overwrite existing blobs in your blob storage
          overwrite: 'true'







